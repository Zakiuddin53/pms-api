name: Build & Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package artifact
        run: |
          VERSION=$(date +'%Y.%m.%d-%H%M%S')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          mkdir package
          cp -r dist package.json package-lock.json ecosystem.config.js package/
          tar -czf pms-api-$VERSION.tar.gz -C package .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          files: pms-api-${{ env.VERSION }}.tar.gz
