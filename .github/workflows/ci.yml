name: CI Build Artifact

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test --if-present -- --passWithNoTests

      - name: Create Linux artifact (tar.gz)
        run: |
          tar -czf pms-api-artifact.tar.gz \
            dist \
            package.json \
            package-lock.json \
            ecosystem.config.js

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pms-api-artifact
          path: pms-api-artifact.tar.gz
